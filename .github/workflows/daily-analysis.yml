name: Daily stock analysis

on:
  schedule:
    # UTC 12:00 = 한국 시간 21:00
    - cron: "0 12 * * *"

  # GitHub 화면에서 수동 실행도 가능
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run daily analysis
        run: python batch_daily.py

      - name: Upload charts and analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-analysis-${{ github.run_id }}
          path: |
            img/*.gif
            output/*.csv
            output/*.json
          if-no-files-found: warn
          retention-days: 7
